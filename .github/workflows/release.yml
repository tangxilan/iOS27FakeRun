name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: false
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run pytest suite
        run: python -m pytest -v

      - name: Build Windows EXE & ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $inputTag = "${{ inputs.tag }}"
          $ver = if ("${{ github.ref_type }}" -eq "tag" -and $tag) { $tag } elseif ($inputTag) { $inputTag } else { "v1.2.0" }
          python build_exe.py --version $ver
          "RELEASE_TAG=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "iOS27FakeRun ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## iOS27FakeRun ${{ github.ref_name }} (Windows 64位免安装版)

            ### 下载与使用（给同学的极简步骤）
            1. 下载下方附件 **`iOS27FakeRun-${{ github.ref_name }}-win64.zip`** 并完整解压到一个文件夹；
            2. 双击文件夹里的 **`iOS27FakeRun.exe`** 启动桌面端（无需安装 Python！首次启动会自动弹出**环境检测与新手引导**，如缺少 Apple 手机驱动按弹窗按钮安装即可）；
            3. iPhone 开启 **设置 → 隐私与安全性 → 开发者模式** 后用数据线连接电脑，点击顶部 **连接设备** 即可开始校园跑或定点打卡；
            4. 需要用安卓手机遥控时，双击同目录下的 **`局域网远程启动.bat`**。

            ### 本版更新亮点
            - **任意跑道 & 单段路往返支持**：新增 **📍 6点自由跑道**（拖动 6 个点即可贴合任意 200m/300m/非标准场地），支持 **闭合环形 / 往返折返（某一段路两侧来回跑）/ 单程路跑** 三种路线模式；
            - **先快后慢·体力衰减配速**：第一圈体力充沛跑得更快，后面几圈自然逐步掉速，仪表盘实时展示每圈分段配速；
            - **拟真 Frenet 横向 GPS 漂移**：沿切线横向自然摆动 + 每圈轻微换道，告别原地倒退跳点；
            - **多源校园搜索 + 环境自检 + 5步新手引导**（支持搜“西安建筑科技大学草堂校区”等分校区）。
          files: dist/iOS27FakeRun-*-win64.zip
